
<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #333; color: white; }
    .row { display: flex; gap: 20px; margin-bottom: 30px; align-items: center; }
    .card-light { background: #ffffff; padding: 20px; border-radius: 12px; color: black; }
    .card-dark { background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .card-primary { background: #15803d; padding: 20px; border-radius: 12px; }
    img { display: block; }
  </style>
</head>
<body>
  <h2>SVG Logo Test</h2>
  <div class="row">
    <div class="card-light">
      <p>Light BG (h=64px)</p>
      <img src="/images/Gemini_Generated_Image_8tc6tg8tc6tg8tc6.svg" style="height:64px; width:auto;" />
    </div>
    <div class="card-dark">
      <p>Dark BG (h=64px)</p>
      <img src="/images/Gemini_Generated_Image_8tc6tg8tc6tg8tc6.svg" style="height:64px; width:auto;" />
    </div>
    <div class="card-dark">
      <p>Dark BG with invert/brightness (h=64px)</p>
      <img src="/images/Gemini_Generated_Image_8tc6tg8tc6tg8tc6.svg" style="height:64px; width:auto; filter: brightness(0) invert(1);" />
    </div>
  </div>
  <div class="row">
    <div class="card-light">
      <p>Full 240px on Light</p>
      <img src="/images/Gemini_Generated_Image_8tc6tg8tc6tg8tc6.svg" style="width:240px; height:auto;" />
    </div>
    <div class="card-dark">
      <p>Full 240px on Dark</p>
      <img src="/images/Gemini_Generated_Image_8tc6tg8tc6tg8tc6.svg" style="width:240px; height:auto;" />
    </div>
  </div>
</body>
</html>
